<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Reader Window — Paper</title>
<style>
  :root{
    --page: #ece7da;
    --paper: #f9f6ee;
    --paper-2: #f1ece0;
    --border: #ddd3bf;
    --border-soft: #e7dfcc;
    --ink: #8a8271;
    --ink-dim: #b3ab98;
    --accent: #c99a6b;
    --accent-soft: rgba(201,154,107,0.35);
  }

  *{ box-sizing:border-box; }

  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background: radial-gradient(ellipse at 50% 0%, #f3efe4 0%, var(--page) 65%);
    font-family: ui-monospace, 'SFMono-Regular', Menlo, monospace;
    padding:40px 16px;
  }

  /* ================= WINDOW ================= */
  .window{
    position:relative;
    width:min(460px, 100%);
    aspect-ratio: 4 / 3;
    border-radius:20px;
    background: var(--paper);
    border:1px solid var(--border);
    box-shadow:
      0 24px 50px -20px rgba(120,105,75,0.28),
      0 6px 16px -8px rgba(120,105,75,0.16);
    display:flex;
    flex-direction:column;
    overflow:hidden;
    animation: pop-in 300ms cubic-bezier(.2,.9,.25,1.1);
  }

  @keyframes pop-in{
    from{ opacity:0; transform: scale(.96) translateY(8px); }
    to{ opacity:1; transform: scale(1) translateY(0); }
  }

  /* ---- slim title bar, like an ordinary window chrome ---- */
  .titlebar{
    flex:0 0 auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:14px 18px;
    border-bottom:1px solid var(--border-soft);
    background: linear-gradient(180deg, var(--paper), var(--paper-2));
  }

  .controls{
    display:flex;
    gap:7px;
  }
  .controls span{
    width:9px; height:9px;
    border-radius:50%;
    background: var(--border);
  }
  .controls span:first-child{
    background: var(--accent);
    opacity:.8;
  }

  .marker{
    width:16px; height:16px;
    border-radius:4px;
    border:1.5px solid var(--ink-dim);
    opacity:.6;
  }

  /* ---- empty reading pane ---- */
  .pane{
    position:relative;
    flex:1 1 auto;
    margin:14px;
    border-radius:12px;
    background: var(--paper-2);
    border:1px dashed var(--border);
  }

  /* soft corner fold, a quiet nod to a page without reading like the old draft */
  .pane::after{
    content:"";
    position:absolute;
    right:0; bottom:0;
    width:26px; height:26px;
    background: linear-gradient(135deg, transparent 50%, var(--border-soft) 50%);
    border-bottom-right-radius:12px;
  }

  /* ---- footer strip, minimal, just a hairline + small tick ---- */
  .footer{
    flex:0 0 auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:12px 18px 16px;
  }
  .footer .tick{
    width:36px;
    height:2px;
    border-radius:2px;
    background: var(--border);
  }
  .footer .dot{
    width:6px; height:6px;
    border-radius:50%;
    background: var(--accent);
    opacity:.7;
  }

  .caption{
    text-align:center;
    color:#a49b87;
    font-size:11.5px;
    letter-spacing:.5px;
    margin-top:22px;
  }
</style>
</head>
<body>

<div class="window">
  <div class="titlebar">
    <div class="controls"><span></span><span></span><span></span></div>
    <div class="marker"></div>
  </div>

  <div class="pane"></div>

  <div class="footer">
    <div class="tick"></div>
    <div class="dot"></div>
  </div>
</div>

</body>
</html>
